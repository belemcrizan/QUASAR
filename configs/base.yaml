background:
  model: statistical
  window: 48
  min_history: 24
  robust: true
dynamics:
  recent_window: 12
  bins: 8
detector:
  threshold: 0.34
  weights:
    residual: 0.30
    entropy_change: 0.10
    mutual_info_change: 0.12
    js_divergence: 0.20
    change_point: 0.18
    regime_change: 0.10
forecast:
  horizon_steps: 4
  method: logistic
  slope: 9.0
  ensemble_slopes: [5.0, 9.0, 15.0]
  conformal_coverage: 0.90
validation:
  calibration_method: temperature
  calibration_fraction: 0.20
  test_fraction: 0.25
  calibration_bins: 10
